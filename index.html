<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOOM AI - Google Style</title>
<style>
body{margin:0;font-family:Arial;text-align:center;background:#fff}
.logo{font-size:60px;font-weight:bold;margin-top:100px}
.logo span:nth-child(1){color:#4285F4} .logo span:nth-child(2){color:#EA4335}
.logo span:nth-child(3){color:#FBBC05} .logo span:nth-child(4){color:#4285F4}
.logo span:nth-child(5){color:#34A853} .logo span:nth-child(6){color:#EA4335}
.search{width:85%;max-width:500px;padding:15px 20px;border:1px solid #ddd;border-radius:25px;font-size:18px;margin-top:30px;outline:none}
.btns{margin-top:25px}
.btn{padding:10px 20px;margin:5px;border:none;background:#f8f9fa;border-radius:5px;font-size:14px}
.mic{font-size:22px;margin-left:-40px;cursor:pointer}
.tag{margin-top:20px;color:#555}
</style>
</head>
<body>
<div class="logo"><span>D</span><span>O</span><span>O</span><span>M</span> <span>A</span><span>I</span></div>
<p class="tag">BOLO - BAN JAYEGA - 100% FREE</p>
<input class="search" placeholder="Bolo... Photo, Video, Code banao"><span class="mic">🎤</span>
<div class="btns">
<button class="btn">🎙️ BOLO ABHI</button>
<button class="btn">DOOM Search</button>
</div>
<p style="margin-top:80px;color:#ff0000;font-weight:bold">YOUR FINAL CHOICE IS DOOM ONLY 🔥</p>
</body>
</html>
